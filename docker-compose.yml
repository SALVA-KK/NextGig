services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nextgig_db
    restart: always
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-nextgig_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-nextgig_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: nextgig_redis
    restart: always
    ports:
      - "6379:6379"

  moto:
    image: motoserver/moto:5.0.5
    container_name: nextgig_moto
    restart: always
    ports:
      - "5000:5000"

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextgig_web
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: ${CONTAINER_DB_HOST:-db}
      DB_PORT: ${CONTAINER_DB_PORT:-5432}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      REDIS_CHANNEL_URL: redis://redis:6379/2
      FIREBASE_CREDENTIALS_FILE: /app/firebase-service-account.json
      FCM_ENABLED: ${FCM_ENABLED:-false}
      AWS_EVENTS_ENABLED: ${AWS_EVENTS_ENABLED:-false}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL-http://moto:5000}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY-test}
      AWS_SQS_QUEUE_NAME: ${AWS_SQS_QUEUE_NAME:-nextgig-notifications-queue}
      AWS_SQS_DLQ_NAME: ${AWS_SQS_DLQ_NAME:-nextgig-notifications-dlq}
      AWS_SNS_TOPIC_NAME: ${AWS_SNS_TOPIC_NAME:-nextgig-notifications-topic}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN-arn:aws:sns:us-east-1:123456789012:nextgig-notifications-topic}
      AWS_SNS_TOPIC_ARN: ${AWS_SNS_TOPIC_ARN-arn:aws:sns:us-east-1:123456789012:nextgig-notifications-topic}
      S3_STORAGE_ENABLED: ${S3_STORAGE_ENABLED:-false}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL-http://moto:5000}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-nextgig-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_BASE: ${S3_PUBLIC_BASE-localhost:5000/nextgig-media}
      S3_URL_PROTOCOL: ${S3_URL_PROTOCOL-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextgig_celery_worker
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: ${CONTAINER_DB_HOST:-db}
      DB_PORT: ${CONTAINER_DB_PORT:-5432}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      REDIS_CHANNEL_URL: redis://redis:6379/2
      FIREBASE_CREDENTIALS_FILE: /app/firebase-service-account.json
      FCM_ENABLED: ${FCM_ENABLED:-false}
      AWS_EVENTS_ENABLED: ${AWS_EVENTS_ENABLED:-false}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL-http://moto:5000}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY-test}
      AWS_SQS_QUEUE_NAME: ${AWS_SQS_QUEUE_NAME:-nextgig-notifications-queue}
      AWS_SQS_DLQ_NAME: ${AWS_SQS_DLQ_NAME:-nextgig-notifications-dlq}
      AWS_SNS_TOPIC_NAME: ${AWS_SNS_TOPIC_NAME:-nextgig-notifications-topic}
      S3_STORAGE_ENABLED: ${S3_STORAGE_ENABLED:-false}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL-http://moto:5000}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-nextgig-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_BASE: ${S3_PUBLIC_BASE-localhost:5000/nextgig-media}
      S3_URL_PROTOCOL: ${S3_URL_PROTOCOL-}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A config worker --loglevel=info

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextgig_celery_beat
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: ${CONTAINER_DB_HOST:-db}
      DB_PORT: ${CONTAINER_DB_PORT:-5432}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      REDIS_CHANNEL_URL: redis://redis:6379/2
      FIREBASE_CREDENTIALS_FILE: /app/firebase-service-account.json
      FCM_ENABLED: ${FCM_ENABLED:-false}
      AWS_EVENTS_ENABLED: ${AWS_EVENTS_ENABLED:-false}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL-http://moto:5000}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY-test}
      AWS_SQS_QUEUE_NAME: ${AWS_SQS_QUEUE_NAME:-nextgig-notifications-queue}
      AWS_SQS_DLQ_NAME: ${AWS_SQS_DLQ_NAME:-nextgig-notifications-dlq}
      AWS_SNS_TOPIC_NAME: ${AWS_SNS_TOPIC_NAME:-nextgig-notifications-topic}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A config beat --loglevel=info

  lambda_poller:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextgig_lambda_poller
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: ${CONTAINER_DB_HOST:-db}
      DB_PORT: ${CONTAINER_DB_PORT:-5432}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      REDIS_CHANNEL_URL: redis://redis:6379/2
      FIREBASE_CREDENTIALS_FILE: /app/firebase-service-account.json
      FCM_ENABLED: ${FCM_ENABLED:-false}
      AWS_EVENTS_ENABLED: "false"
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL-http://moto:5000}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY-test}
      AWS_SQS_QUEUE_NAME: ${AWS_SQS_QUEUE_NAME:-nextgig-notifications-queue}
      AWS_SQS_DLQ_NAME: ${AWS_SQS_DLQ_NAME:-nextgig-notifications-dlq}
      AWS_SNS_TOPIC_NAME: ${AWS_SNS_TOPIC_NAME:-nextgig-notifications-topic}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN-arn:aws:sns:us-east-1:123456789012:nextgig-notifications-topic}
      AWS_SNS_TOPIC_ARN: ${AWS_SNS_TOPIC_ARN-arn:aws:sns:us-east-1:123456789012:nextgig-notifications-topic}
      S3_STORAGE_ENABLED: ${S3_STORAGE_ENABLED:-false}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL-http://moto:5000}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-nextgig-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_BASE: ${S3_PUBLIC_BASE-localhost:5000/nextgig-media}
      S3_URL_PROTOCOL: ${S3_URL_PROTOCOL-}
    volumes:
      - ./backend:/app
    depends_on:
      moto:
        condition: service_started
      web:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: python manage.py poll_notification_queue

volumes:
  postgres_data:
